name: Deploy Python API to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code from GitHub Repo
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies for Verification
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Deploy Package to Azure Web App via Publish Profile
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'app-paymentgateway-api-g8fdmdjbrhuaje2ah'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
